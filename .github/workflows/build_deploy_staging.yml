name: Generate Executable Server - Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

jobs:
  build_server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/staging/Dockerfile
          push: true
          tags: corentin35/rcnet-server-template:staging-${{ github.sha }}

      # Puis ensuite déployer sur le cluster pour Agones en utilisant l'image Docker précédemment créée, en taguant l'image avec le numéro de version de la release.