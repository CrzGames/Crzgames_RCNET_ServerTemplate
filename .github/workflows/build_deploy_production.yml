name: Generate Executable Server - Production

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write
  discussions: write

jobs:
  build_server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Get latest release tag
        id: previoustag
        uses: WyriHaximus/github-action-get-previous-tag@v2

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/production/Dockerfile
          push: true
          tags: corentin35/rcnet-server-template:${{ steps.previoustag.outputs.tag }}

      # Puis ensuite déployer sur le cluster pour Agones en utilisant l'image Docker précédemment créée, en taguant l'image avec le numéro de version de la release.